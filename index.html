<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الشيباني ستور</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    height: 100%;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif; 
    background-color: #0b0d10;
    color: #c8ced8;
  }

  /* تصميم خلفية داكنة واحترافية متناسقة مع متجر الألعاب */
  #bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    background: linear-gradient(135deg, #0b0d10 0%, #151a21 50%, #1a0b12 100%);
  }

  /* طبقة المحتوى فوق الخلفية */
  #container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #brand { 
    text-align: center; 
    padding: 16px 10px; 
    background: rgba(14, 17, 22, 0.85);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
    backdrop-filter: blur(8px);
  }

  /* تصميم لوكو احترافي دائري متناسق */
  .store-logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(45deg, #ff416c, #ff4b2b);
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin-left: 8px;
    vertical-align: middle;
    box-shadow: 0 2px 8px rgba(255, 65, 108, 0.4);
  }

  #brand b { 
    font-size: 18px; 
    font-weight: 700; 
    letter-spacing: .08em;
    color: #ffffff; 
    vertical-align: middle; 
  }

  #phone { 
    font-size: 13px; 
    color: #7fd0a0; 
    margin-top: 4px; 
    font-weight: 600; 
  }

  #wrap { 
    padding: 24px 18px; 
    text-align: center; 
    flex: 1; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  #state { 
    font-size: 22px; 
    font-weight: 700; 
    margin: 0 0 10px; 
    text-shadow: 0 2px 4px rgba(0,0,0,0.8); 
  }

  #det { 
    font-size: 13px; 
    color: #c8ced8; 
    margin: 0 0 6px; 
  }

  #det b { 
    color: #ffffff; 
    font-weight: 600; 
  }

  #cache { 
    font-size: 12px; 
    color: #a1abb8; 
    margin: 0 0 10px; 
    min-height: 14px; 
  }

  #cache.cacheok { color: #7fd0a0; }
  .ok { color: #7fd0a0; } 
  .bad { color: #ff6b6b; } 
  .warn { color: #ffd166; }
</style>
</head>
<body>

<div id="bg-overlay"></div>

<div id="container">
  <div id="brand">
    <span class="store-logo">ش</span>
    <b>الشيباني ستور</b>
    <div id="phone">07722551187</div>
  </div>

  <div id="wrap">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var params = new URLSearchParams(location.search);

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>" : " &middot; غير متوافق مع هذا الإصدار");

    var target = "jb.html" + location.search;
    function go() { setState("جاري تحميل الثغرة...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("إصدار غير مدعوم", "bad");
        waitForTap("اضغط X أو انقر هنا للمتابعة على أي حال", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("وضع عدم الاتصال -- يعمل من الذاكرة المؤقتة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("تم التخزين المؤقت بنجاح", true);
        go();
    } else {
        ac.addEventListener("noupdate", function () {
            setCache("جاهز للاستخدام بدون إنترنت", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("فشل التحميل المؤقت");
            waitForTap("اضغط X أو انقر للمتابعة", go);
        }, false);
        // التفعيل التلقائي بعد التفاعل
        waitForTap("اضغط X أو انقر على الشاشة للبدء", go);
    }
})();
</script>

</body>
</html>
